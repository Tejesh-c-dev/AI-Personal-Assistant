services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_personal_assistant_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_test_only_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - assistant_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_personal_assistant_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  assistant_test_pgdata:
